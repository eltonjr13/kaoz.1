name: Publicar aplicativo Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preparar Vulkan SDK
        shell: pwsh
        run: |
          $version = "1.4.350.0"
          $expectedSha256 = "855b27ba05d2d8119c5114c5d4ff870ca38f2c632b11e1bb9923b9b7e6ecfe7b"
          $installer = Join-Path $env:RUNNER_TEMP "vulkan-sdk-$version.exe"
          $sdkRoot = Join-Path $env:RUNNER_TEMP "VulkanSDK-$version"
          Invoke-WebRequest `
            -Uri "https://sdk.lunarg.com/sdk/download/$version/windows/vulkan_sdk.exe" `
            -OutFile $installer
          $actualSha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Checksum inesperado para o Vulkan SDK: $actualSha256"
          }
          & $installer `
            --root $sdkRoot `
            --accept-licenses `
            --default-answer `
            --confirm-command `
            install `
            copy_only=1
          if ($LASTEXITCODE -ne 0) {
            throw "A instalacao do Vulkan SDK terminou com codigo $LASTEXITCODE."
          }
          @(
            (Join-Path $sdkRoot "Include\vulkan\vulkan.h"),
            (Join-Path $sdkRoot "Lib\vulkan-1.lib"),
            (Join-Path $sdkRoot "Bin\glslc.exe")
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_ -PathType Leaf)) {
              throw "Componente obrigatorio do Vulkan SDK nao encontrado: $_"
            }
          }
          "VULKAN_SDK=$sdkRoot" >> $env:GITHUB_ENV
          "VK_SDK_PATH=$sdkRoot" >> $env:GITHUB_ENV
          "REQUIRE_WHISPER_VULKAN=1" >> $env:GITHUB_ENV
          (Join-Path $sdkRoot "Bin") >> $env:GITHUB_PATH

      - name: Instalar dependências
        run: npm ci

      - name: Validar integração DaVinci Resolve
        run: npm run test:davinci-resolve

      - name: Gerar instalador e metadados
        run: npm run desktop:build

      - name: Validar assets de atualização
        run: npm run desktop:verify-release

      - name: Definir versão da release
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV

      - name: Criar rascunho com todos os assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" `
            "release/Kaoz.1-Setup-$env:RELEASE_VERSION.exe" `
            "release/Kaoz.1-Setup-$env:RELEASE_VERSION.exe.blockmap" `
            "release/latest.yml" `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title "Kaoz.1 $env:RELEASE_TAG" `
            --generate-notes `
            --draft

      - name: Publicar somente após upload completo
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --draft=false
